# XcodeGen spec for Vow. On a Mac: `brew install xcodegen && xcodegen generate`.
# Without XcodeGen: `python3 scripts/gen_xcodeproj.py` (mirrors this file; keep them in sync).
name: Vow

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  Vow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Vow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vow
        PRODUCT_NAME: Vow
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Explicit Info.plist (display name, icon, launch screen, portrait, dark).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Vow/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  Vow:
    build:
      targets:
        Vow: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
