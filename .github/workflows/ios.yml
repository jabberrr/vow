name: iOS build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (committed Vow.xcodeproj)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XC" ]; then
            echo "Selecting $XC"
            sudo xcode-select -s "$XC/Contents/Developer"
          else
            echo "::warning::No /Applications/Xcode_16*.app found; using default $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Vow.xcodeproj \
            -scheme Vow \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Unit tests (VowTests on an iPhone simulator)
        run: |
          set -o pipefail
          # Newest iOS runtime this Xcode's SDK can run, first iPhone on it.
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json"
          UDID="$(SDK="$SDK" SIMS="$RUNNER_TEMP/sims.json" python3 - <<'PY'
          import json, os, re, sys
          sdk = tuple(int(x) for x in os.environ["SDK"].split(".")[:2])
          devices = json.load(open(os.environ["SIMS"]))["devices"]
          best = None
          for runtime, devs in devices.items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              if ver > sdk:
                  continue
              phones = [d for d in devs if d.get("isAvailable", True) and d["name"].startswith("iPhone")]
              if phones and (best is None or ver > best[0]):
                  best = (ver, phones[0]["udid"], phones[0]["name"])
          if best is None:
              sys.exit("no available iPhone simulator for iOS SDK %s" % os.environ["SDK"])
          sys.stderr.write("Using %s (iOS %d.%d) %s\n" % (best[2], best[0][0], best[0][1], best[1]))
          print(best[1])
          PY
          )"
          xcodebuild \
            -project Vow.xcodeproj \
            -scheme Vow \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test | tee -a build.log

      - name: Archive for device (unsigned) and check the app icon
        run: |
          set -o pipefail
          xcodebuild \
            -project Vow.xcodeproj \
            -scheme Vow \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Vow.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee -a build.log
          APP="$RUNNER_TEMP/Vow.xcarchive/Products/Applications/Vow.app"
          test -f "$APP/Assets.car"
          plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$APP/Info.plist" | grep -qx AppIcon
          plutil -extract CFBundleDisplayName raw "$APP/Info.plist" | grep -qx Vow
          echo "Archive OK: icon compiled, Info.plist has CFBundleIcons"

      - name: Show compiler errors
        if: failure()
        run: grep -nE "(error|fatal error):|Test Case .* failed|\*\* TEST FAILED" build.log | head -100 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Check committed project is up to date with gen_xcodeproj.py
        continue-on-error: true
        run: |
          python3 scripts/gen_xcodeproj.py
          git diff --stat --exit-code -- Vow.xcodeproj

  xcodegen:
    name: Build (xcodegen from project.yml, non-blocking)
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16
        run: |
          XC="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Vow.xcodeproj \
            -scheme Vow \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-xcodegen.log
